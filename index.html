<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Del Caribe al Eje Cafetero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--c1:#0b7fa0;--c2:#2a8a4a;--c3:#5865b0;--c4:#a0561d;--t1:#e3f4fa;--t2:#e7f4e9;--t3:#e9ecf8;--t4:#f7ece1;--ink:#17302d;--mut:#56696a;--bg:#fff;--card-bg:#fff;--border:#17302d1f}
body.dark{--c1:#38bdf8;--c2:#4ade80;--c3:#818cf8;--c4:#fb923c;--t1:#073642;--t2:#064e3b;--t3:#312e81;--t4:#431407;--ink:#f1f5f9;--mut:#94a3b8;--bg:#0f172a;--card-bg:#1e293b;--border:#64748b}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}
body{margin:0;font:400 16px/1.55 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg);transition:background .3s,color .3s}
body.admin{padding-bottom:118px}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}

/* ---- LOGIN ---- */
#lg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;color:#fff;overflow:hidden;background:linear-gradient(#ff9d6c 0%,#ffd08a 28%,#8fd3ea 62%,#0b7fa0 100%)}
#lg .card{position:relative;z-index:2;width:100%;max-width:380px;text-align:center;background:#ffffffe6;backdrop-filter:blur(10px);color:#17302d;border-radius:22px;padding:34px 26px;box-shadow:0 20px 60px #0a4a6340}
#lg h1{font-size:1.9rem;line-height:1.05;margin:0 0 6px;letter-spacing:-.02em}
#lg .sub2{color:#56696a;font-size:.95rem;margin:0 0 22px}
#lg input{width:100%;padding:13px 16px;font:500 1rem Figtree,sans-serif;border:2px solid #d3ded9;border-radius:12px;outline:none;text-align:center;background:#fff;color:#17302d}
#lg input:focus{border-color:var(--c1)}
#lg .go{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--c1);color:#fff;font-weight:700;font-size:1rem}
#lg .go:active{transform:scale(.98)}
#lg .adm{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--c2);color:#fff;font-weight:700;font-size:1rem}
#lerr{color:#c0392b;font-size:.88rem;margin-top:10px;min-height:1.2em}
.sun{position:absolute;left:50%;top:30%;width:140px;height:140px;margin-left:-70px;border-radius:50%;background:#fff3c4;box-shadow:0 0 90px 30px #ffe9a8aa;animation:rise 2.4s cubic-bezier(.2,.8,.2,1) both}
.plane{position:absolute;top:14%;left:0;width:52px;opacity:0;filter:drop-shadow(0 4px 8px rgba(10,74,99,.3));animation:fly 15s .8s ease-in-out both}
.plane svg{display:block;width:100%}
.cloud{position:absolute;border-radius:30px;background:#fff;opacity:.55;filter:blur(1px)}
.cl1{top:12%;width:130px;height:36px;animation:drift 58s linear infinite}
.cl2{top:24%;width:90px;height:26px;animation:drift 74s -30s linear infinite;opacity:.4}
.lwave{position:absolute;left:0;bottom:0;width:100%;height:30%}

/* ---- BARRA SUPERIOR ---- */
#bar{position:fixed;top:0;left:0;right:0;z-index:9;height:46px;padding:0 12px;display:none;align-items:center;gap:8px;background:var(--card-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
#bar.on{display:flex}
#lab{font-weight:600;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28%}
.bar-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
#who{font-size:.78rem;font-weight:600;color:var(--mut);white-space:nowrap;text-decoration:underline;padding:4px}
#admin-switcher{font-size:.78rem;background:var(--t1);color:var(--c1);border:1px solid var(--c1);border-radius:6px;padding:3px 6px;font-weight:700}
#trk{position:relative;flex:1;height:6px;min-width:30px}
.sg{display:flex;height:100%;border-radius:3px;overflow:hidden}.sg i{display:block;height:100%}
#mk{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--c1);border:2.5px solid var(--bg);box-shadow:0 1px 4px #0005;transition:background .4s}
.btn-ico{background:none;border:0;font-size:1rem;padding:4px;border-radius:6px;color:var(--ink)}

/* ---- HERO ---- */
.hero{position:relative;min-height:92svh;display:grid;align-content:center;padding:24px;color:#fff;overflow:hidden;background:linear-gradient(#ff9d6c 0%,#ffd08a 28%,#8fd3ea 62%,#0b7fa0 100%)}
.hw{position:absolute;left:0;bottom:0;width:100%;height:34%}
.hint{position:absolute;left:0;right:0;bottom:36%;text-align:center;font-weight:600;font-size:.9rem;animation:bob 1.8s ease-in-out infinite}
.hero h1{font-weight:800;font-size:clamp(2.5rem,10vw,5.5rem);line-height:.98;letter-spacing:-.025em;margin:0 0 14px;max-width:9em;text-shadow:0 2px 24px #0a4a6366}
.hero p{max-width:30em;font-size:1.05rem;margin:0;text-shadow:0 1px 12px #0a4a6388}

/* ---- TARJETA BIENVENIDA ---- */
.welcome-card-wrap {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  margin: 16px auto;
  max-width: 680px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  box-shadow: 0 4px 12px rgba(0,0,0,.03);
}
.welcome-card-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--bg-img);
  background-size: cover;
  background-position: center;
  opacity: 0.18;
  pointer-events: none;
  transition: opacity .3s;
}
body.dark .welcome-card-wrap::before {
  opacity: 0.12;
}
.welcome-card-content {
  position: relative;
  z-index: 1;
  padding: 20px;
}
.welcome-card-content h3{margin:0 0 6px;font-size:1.35rem;color:var(--c1)}
.welcome-card-content p{margin:0;color:var(--mut);font-size:.92rem;line-height:1.6}

.welcome-header-flex {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 12px;
}
.welcome-caricature-big, .welcome-caricature-petro {
  width: 100px;
  height: 100px;
  flex: none;
  object-fit: cover;
  border-radius: 50%;
  background: transparent;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  transform: translateZ(0);
}
.welcome-caricature-big {
  border: 3px solid var(--c4);
  box-shadow: 0 4px 14px rgba(160,86,29,0.25);
}
.welcome-caricature-petro {
  border: 3px solid var(--c1);
  box-shadow: 0 4px 14px rgba(11,127,160,0.25);
}

@media(min-width: 768px) {
  .welcome-caricature-big, .welcome-caricature-petro {
    width: 120px;
    height: 120px;
  }
}

.welcome-speech-bubble {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--border);
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 0.9rem;
  line-height: 1.5;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  flex: 1;
}

/* ---- DÍAS ---- */
.day{position:relative;background:var(--t)}
.bn{position:relative;height:200px;overflow:hidden;background:linear-gradient(var(--sk),var(--t))}
.sc{position:absolute;left:0;bottom:-30px;width:100%;height:170px;will-change:transform}
.cld{position:absolute;top:34px;left:0;width:120px;height:34px;border-radius:30px;background:#fff;opacity:.7;filter:blur(1px);animation:drift 46s linear infinite}
.num{position:absolute;left:max(16px,calc(50% - 340px));top:18px;font-weight:800;font-size:5.2rem;line-height:1;color:#fff;text-shadow:0 2px 18px #0005}
.in2{max-width:680px;margin:0 auto;padding:6px 16px 60px}
.dt{color:var(--mut);font-weight:500;margin:12px 0 0}
h2{font-weight:700;font-size:clamp(1.7rem,6vw,2.2rem);line-height:1.1;margin:4px 0 6px}
.v{font-size:1.05rem;font-style:italic;color:var(--c);font-weight:500;margin:0 0 8px}
.bd{display:inline-block;background:var(--c);color:#fff;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;margin:2px 0 4px}
.pn{margin:10px 0 0;padding:9px 12px;border-left:4px solid var(--c);background:var(--card-bg);border-radius:0 9px 9px 0;font-size:.92rem;border:1px solid var(--border);border-left-width:4px}
.pn b{font-weight:600}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:grid;grid-template-columns:5.2rem 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--border)}
li:first-child{border-top:0}.tm{font-weight:600;font-size:.9rem;color:var(--c)}
.n{margin:10px 0 0;padding:9px 12px;border-left:4px solid var(--c);background:var(--card-bg);border-radius:0 9px 9px 0;font-size:.92rem;border:1px solid var(--border);border-left-width:4px}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}

/* ---- SEMI-FONDO DE DESTINO ---- */
.day-bg-wrap {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  margin: 12px 0;
  border: 1px solid var(--border);
  background: var(--card-bg);
}
.day-bg-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--bg-img);
  background-size: cover;
  background-position: center;
  opacity: 0.18;
  pointer-events: none;
  transition: opacity .3s;
}
body.dark .day-bg-wrap::before {
  opacity: 0.12;
}
.day-bg-content {
  position: relative;
  z-index: 1;
  padding: 14px 16px;
}

/* ---- PAGOS ---- */
#v-pay{max-width:680px;margin:0 auto;padding:64px 16px 84px}
.tots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tot{background:var(--t4);border-radius:12px;padding:10px;text-align:center}
.tot b{display:block;font-size:1.15rem;font-family:"Bricolage Grotesque",sans-serif}
.tot span{font-size:.72rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pday{margin-bottom:14px;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.pday>header{padding:10px 14px;background:var(--t);display:flex;justify-content:space-between;align-items:baseline}
.pday>header h3{margin:0;font-size:1.05rem;color:var(--ink)}
.pday>header span{font-size:.82rem;font-weight:600;color:var(--mut)}
.cat{padding:4px 14px 8px}
.cat h4{margin:8px 0 2px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.pay{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--border);user-select:none}
.pay:first-of-type{border-top:0}
.pay .bx{width:26px;height:26px;flex:none;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;color:#fff;font-size:.85rem}
.pay.ok .bx{background:var(--c2);border-color:var(--c2)}
.pay.partial .bx{background:var(--c4);border-color:var(--c4)}
.pay .nm{flex:1;font-size:.92rem}
.pay .am{font-weight:700;font-size:.9rem;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pay .am small{font-weight:500;color:var(--mut);font-size:.7rem}
.abonar-btn{display:inline-block;background:var(--t1);color:var(--c1);border:1px solid var(--c1);padding:4px 8px;border-radius:6px;font-size:.75rem;font-weight:700}

/* ---- CHECKLISTS ---- */
#v-chk,#v-done{max-width:680px;margin:0 auto;padding:64px 16px 84px}
.chk-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.chk-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.chk-item:first-child{border-top:0}
.chk-item input{width:22px;height:22px;accent-color:var(--c1)}
.chk-item span{font-weight:500;font-size:.94rem}
.chk-item.done span{text-decoration:line-through;color:var(--mut)}

/* ---- ESTADÍSTICAS & ADMIN ---- */
#v-adm,#v-stats{max-width:680px;margin:0 auto;padding:64px 16px 84px}
.stat-box{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.stat-box h3{margin-top:0;font-size:1.15rem;color:var(--c1)}
.person-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.92rem}
.person-row:last-child{border-bottom:0}

/* ---- MENÚ INFERIOR ---- */
#menu{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;display:none;gap:4px;background:var(--card-bg);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:24px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 12px 35px rgba(0,0,0,0.12)}
body.in #menu{display:flex}
#menu button{flex:1;border:0;background:none;padding:8px 2px;border-radius:18px;font:600 .72rem Figtree,sans-serif;color:var(--mut);display:grid;gap:4px;justify-items:center;transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);position:relative}
#menu button svg{width:20px;height:20px;transition:transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)}
#menu button.on{color:var(--c1);background:var(--t1)}
#menu button.on svg{transform:translateY(-2px) scale(1.15)}

/* ---- ADMIN GESTIÓN ---- */
.aprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.aprow b{flex:1 1 110px}
.aprow input,.aprow select{padding:7px 10px;border:1.5px solid var(--border);border-radius:9px;font:500 .85rem Figtree,sans-serif;background:var(--bg);color:var(--ink)}
.aprow .del{border:0;background:#fdecea;color:#c0392b;border-radius:9px;padding:7px 12px;font-weight:700}
#addp{display:grid;gap:8px;background:var(--t1);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
#addp input{padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font:500 .92rem Figtree,sans-serif;background:var(--bg);color:var(--ink)}
#addp .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#addp button{padding:11px;border:0;border-radius:10px;background:var(--c1);color:#fff;font-weight:700}
.atools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 20px}
.atools button{border:0;border-radius:10px;padding:9px 14px;font:600 .85rem Figtree,sans-serif;background:var(--c1);color:#fff}
.atools .rs{background:var(--c4)}
.paidall{font-size:.72rem;color:var(--mut)}

@keyframes rise{from{transform:translateY(170px) scale(.92);opacity:0}}
@keyframes fly{0%{transform:translate(-100px,42px) rotate(7deg);opacity:0}7%{opacity:1}32%{transform:translate(30vw,8px) rotate(1deg)}58%{transform:translate(56vw,-12px) rotate(-3deg)}85%{opacity:1}100%{transform:translate(calc(100vw + 100px),-44px) rotate(-7deg);opacity:0}}
@keyframes bob{50%{transform:translateY(8px)}}
@keyframes drift{to{transform:translateX(110vw)}}
@keyframes wv1{to{transform:translateX(-100px)}}@keyframes wv2{to{transform:translateX(-120px)}}
@keyframes mist{to{transform:translateX(120px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}

.alt-bd{display:inline-flex;align-items:center;gap:4px;background:var(--card-bg);color:var(--mut);border:1px solid var(--border);font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px}
@keyframes stripes{from{background-position:30px 0}to{background-position:0 0}}
</style></head>
<body>
<!-- LOGIN -->
<div id="lg">
  <div class="sun"></div><div class="cloud cl1"></div><div class="cloud cl2"></div>
  <div class="plane"><svg viewBox="0 0 64 32"><g fill="#fff"><path d="M4 14h50c6 0 8 2 8 2s-2 2-8 2H4z"/><path d="M26 15 18 2h6l16 13zM26 17l-8 13h6l16-13z"/><path d="M8 15 3 7h4l7 8zM8 17l-5 8h4l7-8z"/></g></svg></div>
  <svg class="lwave" viewBox="0 0 800 150" preserveAspectRatio="xMidYMax slice"><g style="animation:wv1 5s linear infinite"><path d="M0 90 q25 -22 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V150H0Z" fill="#fff" opacity=".35"/></g><g style="animation:wv2 7s linear infinite"><path d="M0 112 q30 -18 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V150H0Z" fill="#bfe8f6"/></g></svg>

<!-- APP -->
<div id="bar">
  <span id="lab">Inicio</span>

<div id="menu">
  <button data-v="itin" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2.5-7.5z"/></svg>Itinerario</button>

<script>
const VER=25,PASS="kalen2026";
const H_MED="Comodo Family Laureles, Medellín, $65.000 por persona";
const H_SAL="Mahalo, Salento, $54.000 por persona";
const SK={1:"#bfe8f6",2:"#cfe9d4",3:"#cfd6f0",4:"#efd9c3"};

let audioCtx=null;
function snd(type){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    if(type==="click"){
      osc.frequency.setValueAtTime(440,audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.08);
      osc.start();osc.stop(audioCtx.currentTime+0.08);
    }else if(type==="ok"){
      osc.frequency.setValueAtTime(587.33,audioCtx.currentTime);
      osc.frequency.setValueAtTime(880,audioCtx.currentTime+0.08);
      gain.gain.setValueAtTime(0.08,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.25);
      osc.start();osc.stop(audioCtx.currentTime+0.25);
    }
  }catch(e){}
}

/* 15 mensajes diferentes de Abelardo (Villano cínico / destructor) */
const abelardoMsgs = [

function getDailyMsg(arrList, seedStr){
  let hash = 0;
  for (let i = 0; i < seedStr.length; i++) {
    hash = (hash << 5) - hash + seedStr.charCodeAt(i);
    hash |= 0;
  }
  const index = Math.abs(hash) % arrList.length;
  return arrList[index];
}

const palms=()=>`<path d="M0 100C200 70 380 120 560 90S740 80 800 100V150H0Z" fill="#7aa66a" opacity=".6"/><path d="M0 125Q200 95 400 120T800 110V150H0Z" fill="#4f8a43"/>`+[80,210,350,500,640,730].map((x,i)=>{const t=38+(i%3)*12,c=x+1.5,e=`<ellipse cx="${c}" cy="${t}" rx="15" ry="3.5"`;return `<rect x="${x}" y="${t}" width="3" height="${112-t}" fill="#6b4a2b"/><g fill="#3f7d3a">${e}/>${e} transform="rotate(35 ${c} ${t})"/>${e} transform="rotate(-35 ${c} ${t})"/></g>`}).join("");
const SC={1:()=>wave("var(--c1)",.35,"var(--c1)",1),2:hills,3:peaks,4:palms};

function applies(pay,p){
  const w=pay.w;
  if(w==="all")return true;
  if(w==="g1")return p.who==="g1";
  if(w==="g2")return p.who==="g2";
  if(w==="g1_fly")return p.who==="g1" && p.arr!=="copey3";
  if(w==="g1_explora")return p.who==="g1" && p.code!=="loly r" && p.code!=="hector";
  if(w.startsWith("arr:"))return p.arr===w.slice(4);
  if(w.startsWith("ret:"))return p.ret===w.slice(4);
  return false;
}
function myPays(p){return D.pays.filter(x=>applies(x,p))}

function getProfileDesc(p){
  let t = `<b>Perfil de Viajero:</b> `;
  if(p.arr==="baq")t+="Sales el 2 de octubre desde Barranquilla. ";
  else if(p.arr==="copey")t+="Sales el 2 de octubre desde El Copey (Cesar) hacia Santa Marta ($40.000). ";
  else if(p.arr==="copey3")t+="Viajas desde El Copey en la madrugada del día 3 hacia Santa Marta ($40.000). ";
  else if(p.arr==="baq_g2")t+="Perteneces al Grupo 2: viajas desde Barranquilla directo a Pereira el 8 de octubre. ";

  if(p.ret==="baq" && p.arr==="copey")t+="Regresas a Barranquilla el 12, pasas la noche y viajas al día siguiente a El Copey ($55.000).";
  else if(p.ret==="baq")t+="Regresas el 12 en vuelo directo Pereira → Barranquilla.";
  
  if(p.ret==="smt")t+="Regresas el 12 de Pereira a Santa Marta (~4 PM) y viajas de inmediato hacia El Copey.";
  
  if(p.code==="loly a") t+="<br><br><b style='color:var(--c1)'>¡Ojo! Aclaración:</b> Eres <b>Loly A</b> (vuelas desde Barranquilla directo a Pereira el 8).";
  if(p.code==="lola") t+="<br><br><b style='color:var(--c1)'>¡Ojo! Aclaración:</b> Eres <b>Lola</b> (vuelas desde Barranquilla directo a Pereira el 8).";
  if(p.code==="maria") t+="<br><br><b style='color:var(--c1)'>¡Ojo! Aclaración:</b> Eres <b>María</b> (vuelas desde Barranquilla directo a Pereira el 8).";

  return t;
}

function pnote(d,p){
  if(d.n===2){
    if(p.arr==="baq")return "<b>Tu plan:</b> sales de Barranquilla hacia Santa Marta y duermes en El Rodadero.";
    if(p.arr==="copey")return "<b>Tu plan:</b> viajas desde El Copey (Cesar) hasta Santa Marta ($40.000) y duermes en El Rodadero.";
    if(p.arr==="copey3")return "<b>Tu plan:</b> hoy estás en El Copey. Tu viaje a Santa Marta es en la madrugada de mañana.";
    return "<b>Tu plan:</b> tú viajas el 8 de octubre.";
  }
  if(d.n===3){
    if(p.arr==="copey3")return "<b>Tu plan:</b> llegas desde El Copey en la madrugada de hoy a Santa Marta para unirte al vuelo a Medellín.";
    if((p.code==="loly r"||p.code==="hector"))return "<b>Tu plan:</b> no vas al Parque Explora esta tarde; tienes la tarde libre / pendiente por definir.";
  }
  if(d.n===8&&p.arr==="baq_g2")return "<b>Tu plan:</b> hoy viajas desde Barranquilla directo a Pereira. Aterrizas ~1:00 PM, te encuentras con todos en el hotel a las 2 PM y vamos a los termales.";
  if(d.n===12){
    if(p.ret==="baq"&&p.arr==="copey")return "<b>Tu plan:</b> regresas a Barranquilla el 12, pasas la noche y el día siguiente viajas hacia El Copey ($55.000).";
    if(p.ret==="baq")return "<b>Tu plan:</b> vuelo de regreso Pereira → Barranquilla.";
    if(p.ret==="smt")return "<b>Tu plan:</b> regresas de Pereira a Santa Marta (~4 PM) y viajas enseguida hacia El Copey.";
  }
  return "";
}

/* ---------- render: pagos con abonos parciales ---------- */
function renderPay(){
  updateAdminSwitcher();
  if(!ME) return;
  const mine=myPays(ME);
  const est=mine.reduce((a,x)=>a+(+x.amt||0),0);
  let paid=0;
  mine.forEach(x=>{
    const pInfo=ME.paid[x.id];
    if(typeof pInfo==="number")paid+=pInfo;
    else if(pInfo===true)paid+=(+x.amt||0);
  });
  const pct=est>0?Math.round((paid/est)*100):0;
  const byDay={};
  mine.forEach(x=>{(byDay[x.day]=byDay[x.day]||[]).push(x)});

  let h=`<div class="welcome-card-wrap" style="margin-top:20px; --bg-img: url('${ME.arr==="copey"||ME.arr==="copey3"?"El Copey.jpg":"Barranquilla.jpg"}')">
    <div class="welcome-card-content">
      <h3>💰 Pagos y Abonos de ${ME.name}</h3>
      <p><b>Modo Admin activo:</b> Estás viendo el estado de <b>${ME.name}</b>. Puedes hacer clic en los círculos o abonar para registrar sus pagos.<br><b>Progreso:</b> ${pct}% pagado</p>
      <div style="background:var(--border);height:8px;border-radius:4px;margin-top:12px;overflow:hidden">
        <div style="background:linear-gradient(45deg, rgba(255,255,255,0.25) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.25) 75%, transparent 75%, transparent);background-size:30px 30px;background-color:var(--c2);width:${pct}%;height:100%;transition:width 0.6s ease-out;animation:stripes 1s linear infinite"></div>
      </div>
    </div>
  </div>`;

  h+=`<div class="tots"><div class="tot"><b>${fmt(est)}</b><span>Total Ruta</span></div><div class="tot" style="background:var(--t2)"><b style="color:var(--c2)">${fmt(paid)}</b><span>Abonado</span></div><div class="tot" style="background:var(--t1)"><b style="color:var(--c1)">${fmt(Math.max(est-paid,0))}</b><span>Saldo</span></div></div>`;

  Object.keys(byDay).sort((a,b)=>a-b).forEach(day=>{
    const dd=D.days.find(x=>x.n==day);
    const items=byDay[day];
    let dEst=items.reduce((a,x)=>a+(+x.amt||0),0);
    let dPaid=items.reduce((a,x)=>{
      const pi=ME.paid[x.id];
      return a+(typeof pi==="number"?pi:(pi===true?(+x.amt||0):0));
    },0);
    const cats={};items.forEach(x=>{(cats[x.cat]=cats[x.cat]||[]).push(x)});

    h+=`<div class="pday" style="--t:var(--t${dd?dd.r:4});--c:var(--c${dd?dd.r:4})"><header><h3>${dd?dd.dt:"Día "+day}</h3><span>${fmt(dPaid)} / ${fmt(dEst)}</span></header>`;
    Object.keys(cats).forEach(c=>{
      h+=`<div class="cat"><h4>${c}</h4>${cats[c].map(x=>{
        const pi=ME.paid[x.id];
        const full=(pi===true||(typeof pi==="number"&&pi>=x.amt));
        const partial=(typeof pi==="number"&&pi>0&&pi<x.amt);
        const cls=full?"ok":(partial?"partial":"");
        const paidAmt=typeof pi==="number"?pi:(pi===true?x.amt:0);
        return `<div class="pay ${cls}" data-id="${x.id}">
          <span class="bx" style="cursor:pointer" title="Marcar pagado">${full?"✓":(partial?"~":"")}</span>
          <span class="nm">${x.item}${partial?`<small style="color:var(--c4)">Abonado: ${fmt(paidAmt)}</small>`:""}</span>
          <span class="am">
            ${fmt(x.amt)}
            <button class="abonar-btn" data-abonar="${x.id}">Abonar</button>
            ${x.note?`<small>${x.note}</small>`:""}
          </span>
        </div>`;
      }).join("")}</div>`;
    });
    h+=`</div>`;
  });

  $("v-pay").innerHTML=h;

  $("v-pay").querySelectorAll(".bx").forEach(bx=>{
    bx.onclick=e=>{
      const id=e.target.closest(".pay").dataset.id;
      const x=D.pays.find(p=>p.id===id);
      const cur=ME.paid[id];
      if(cur===true){delete ME.paid[id];snd("click")}
      else{ME.paid[id]=true;snd("ok")}
      save();renderPay();
    };
  });

  $("v-pay").querySelectorAll("[data-abonar]").forEach(btn=>{
    btn.onclick=e=>{
      const id=e.target.dataset.abonar;
      const x=D.pays.find(p=>p.id===id);
      const cur=typeof ME.paid[id]==="number"?ME.paid[id]:(ME.paid[id]?x.amt:0);
      const val=prompt(`Ingresa el valor abonado para "${x.item}" de ${ME.name} (Total: ${fmt(x.amt)}):`,cur);
      if(val!==null){
        const num=parseInt(val.replace(/\D/g,""))||0;
        if(num<=0)delete ME.paid[id];
        else if(num>=x.amt)ME.paid[id]=true;
        else ME.paid[id]=num;
        snd("ok");save();renderPay();
      }
    };
  });
}

    <div class="row">
      <select id="np-who"><option value="g1">Grupo 1 (viaja del 2)</option><option value="g2">Grupo 2 (llega el 8)</option></select>
      <select id="np-arr"><option value="baq">Llega desde Baq</option><option value="copey">Llega de Copey (Día 2)</option><option value="copey3">Llega de Copey (Mad. Día 3)</option><option value="baq_g2">Vuela de Baq a Pereira (Día 8)</option></select>
    </div>
    <div class="row">
      <select id="np-ret"><option value="baq">Regresa a Baq</option><option value="smt">Regresa a Sta Marta</option></select>
      <button id="np-add">Agregar persona</button>
    </div>
  </div>`;
  
  D.people.forEach(p=>{
    const mine=myPays(p);
    const est=mine.reduce((a,x)=>a+(+x.amt||0),0);
    const paid=mine.reduce((a,x)=>a+(p.paid[x.id]?+x.amt||0:0),0);
    h+=`<div class="aprow" style="--c:var(--c1)"><b>${p.name} <span style="color:var(--mut);font-weight:500">(${p.code})</span></b>
    <select data-f="who" data-id="${p.id}"><option value="g1" ${p.who==="g1"?"selected":""}>G1</option><option value="g2" ${p.who==="g2"?"selected":""}>G2</option></select>
    <select data-f="arr" data-id="${p.id}"><option value="baq" ${p.arr==="baq"?"selected":""}>Baq</option><option value="copey" ${p.arr==="copey"?"selected":""}>Copey2</option><option value="copey3" ${p.arr==="copey3"?"selected":""}>Copey3</option><option value="baq_g2" ${p.arr==="baq_g2"?"selected":""}>Baq→Pereira</option></select>
    <select data-f="ret" data-id="${p.id}"><option value="baq" ${p.ret==="baq"?"selected":""}>→Baq</option><option value="smt" ${p.ret==="smt"?"selected":""}>→SM</option></select>
    <span class="paidall">${fmt(paid)}/${fmt(est)}</span>
    <button class="del" data-del="${p.id}">✕</button></div>`;
  });

  h+=`<h2 style="margin-top:30px">Editar Textos de los Días</h2><div style="display:grid;gap:12px">`;
  D.days.forEach((d,idx)=>{
    h+=`<div class="stat-box" style="padding:12px">
      <h4 style="margin:0 0 6px;color:var(--c1)">Día ${d.n}: ${d.dt}</h4>
      <div style="display:grid;gap:6px">
        <label style="font-size:.8rem;font-weight:600">Título del día:</label>
        <input class="ed-t" data-i="${idx}" value="${d.t}" style="padding:7px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink)">
        <label style="font-size:.8rem;font-weight:600">Subtítulo / Descripción corta:</label>
        <input class="ed-v" data-i="${idx}" value="${d.v}" style="padding:7px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink)">
        <label style="font-size:.8rem;font-weight:600">Hotel / Hospedaje:</label>
        <input class="ed-h" data-i="${idx}" value="${d.h||""}" style="padding:7px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink)">
        <label style="font-size:.8rem;font-weight:600">Nota / Alerta (Ojo):</label>
        <input class="ed-k" data-i="${idx}" value="${d.k||""}" style="padding:7px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink)">
      </div>
    </div>`;
  });
  h+=`</div><button id="save-texts" style="margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--c2);color:#fff;font-weight:700">Guardar Cambios de Textos</button>`;

  h+=`<div class="atools" style="margin-top:20px"><button id="a-cp">Copiar datos</button><button id="a-imp">Importar</button><button class="rs" id="a-rs">Restablecer</button><button id="a-out">Salir de Admin</button></div>`;
  
  $("v-adm").innerHTML=h;
  
  $("np-add").onclick=()=>{
    const n=$("np-n").value.trim(),c=$("np-c").value.trim().toLowerCase();
    if(!n||!c)return alert("Escribe nombre y código");
    if(D.people.some(p=>p.code===c))return alert("Ese código ya existe");
    D.people.push({id:"p"+Date.now(),name:n,code:c,who:$("np-who").value,arr:$("np-arr").value,ret:$("np-ret").value,paid:{},chk:{},done:{}});
    save();renderAdm();
  };

  $("v-adm").querySelectorAll("[data-f]").forEach(s=>s.onchange=()=>{
    const p=D.people.find(x=>x.id===s.dataset.id);p[s.dataset.f]=s.value;save();
  });
  $("v-adm").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(confirm("¿Quitar a esta persona?")){D.people=D.people.filter(x=>x.id!==b.dataset.del);save();renderAdm()}
  });

  $("save-texts").onclick=()=>{
    document.querySelectorAll(".ed-t").forEach(inp=>{
      const i=+inp.dataset.i;
      D.days[i].t=inp.value;
    });
    document.querySelectorAll(".ed-v").forEach(inp=>{
      const i=+inp.dataset.i;
      D.days[i].v=inp.value;
    });
    document.querySelectorAll(".ed-h").forEach(inp=>{
      const i=+inp.dataset.i;
      D.days[i].h=inp.value;
    });
    document.querySelectorAll(".ed-k").forEach(inp=>{
      const i=+inp.dataset.i;
      D.days[i].k=inp.value;
    });
    save();
    alert("¡Textos actualizados con éxito!");
    renderItin();
  };

  $("a-cp").onclick=async()=>{const t=JSON.stringify(D);try{await navigator.clipboard.writeText(t);alert("Copiado")}catch(e){prompt("Copia",t)}};
  $("a-imp").onclick=()=>{const t=prompt("Pega JSON:");try{const x=JSON.parse(t);if(x&&x.ver===VER){D=x;save();renderAdm();renderItin();renderPay();renderChk();renderDone();renderStats();alert("OK")}else alert("No válido")}catch(e){alert("Error")}};
  $("a-rs").onclick=()=>{if(confirm("¿Restablecer todo?")){try{localStorage.removeItem("itin25")}catch(e){}location.reload()}};
  $("a-out").onclick=()=>{logout();};
}

/* ---------- scroll fx ---------- */
let io=null,secs=[],scs=[];
function bindScrollFx(){
  secs=[...document.querySelectorAll(".day")];scs=secs.map(s=>s.querySelector(".sc"));
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
}
function onS(){
  const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
  $("bar").classList.toggle("on",y>innerHeight*.55);
  $("mk").style.left=(max>0?y/max*100:0)+"%";
  let a=null;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.4)a=i});
  if(a!==null){const d=D.days[a];$("lab").textContent="Día "+d.n+": "+d.t;$("mk").style.background="var(--c"+d.r+")"}
  secs.forEach((s,i)=>{const r=s.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)scs[i].style.transform="translateY("+(r.top-innerHeight/2)*.06+"px)"});
}
addEventListener("scroll",onS,{passive:true});

/* ---------- vistas ---------- */
function show(v){
  document.querySelectorAll("#menu button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("app").style.display=v==="itin"?"":"none";
  $("v-hero").style.display=v==="itin"?"":"none";
  $("v-pay").style.display=v==="pay"?"":"none";
  $("v-chk").style.display=v==="chk"?"":"none";
  $("v-done").style.display=v==="done"?"":"none";
  $("v-stats").style.display=v==="stats"?"":"none";
  $("v-adm").style.display=v==="adm"?"":"none";
  $("bar").style.display=v==="itin"?"":"none";
  scrollTo(0,0);onS();
}
document.querySelectorAll("#menu button").forEach(b=>b.onclick=()=>show(b.dataset.v));

/* ---------- login y cambio de usuario / admin ---------- */
function enter(p){
  ME=p;
  ADMIN=false;
  document.body.classList.remove("admin");
  document.body.classList.add("in");
  $("lg").style.display="none";
  $("who").textContent=p.name+" (Cambiar)";
  renderItin();renderPay();renderChk();renderDone();renderStats();show("itin");
  snd("ok");
}
function logout(){
  ADMIN=false;
  ME=null;
  document.body.classList.remove("in","admin");
  $("lg").style.display="grid";
  $("lin").value="";
  $("lerr").textContent="";
  snd("click");
}
function askAdmin(){
  const pwd=prompt("Contraseña de administrador:");
  if(pwd===PASS){
    ADMIN=true;
    ME=D.people[0];
    document.body.classList.add("admin","in");
    $("lg").style.display="none";
    $("who").textContent="Admin ⚡ (Salir)";
    renderItin();renderPay();renderChk();renderDone();renderStats();renderAdm();
    show("stats");
    snd("ok");
  }else if(pwd!==null){
    alert("Contraseña incorrecta");
  }
}
function tryLogin(){
  const v=$("lin").value.trim().toLowerCase();
  const p=D.people.find(x=>x.name.toLowerCase()===v||x.code.toLowerCase()===v);
  if(p){$("lerr").textContent="";enter(p)}
  else{$("lerr").textContent="Nombre o código no reconocido. Verifica con Kalen."}
}
$("lgo").onclick=tryLogin;
$("lin").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin()});
$("ladm").onclick=askAdmin;
</script></body></html>
