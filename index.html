<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Del Caribe al Eje Cafetero</title>
<link rel="icon" type="image/png" href="ruta/o/enlace/de/tu/imagen.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--c1:#0b7fa0;--c2:#2a8a4a;--c3:#5865b0;--c4:#a0561d;--t1:#e3f4fa;--t2:#e7f4e9;--t3:#e9ecf8;--t4:#f7ece1;--ink:#17302d;--mut:#56696a;--bg:#fff;--card-bg:#fff;--border:#17302d1f}
body.dark{--c1:#38bdf8;--c2:#4ade80;--c3:#818cf8;--c4:#fb923c;--t1:#073642;--t2:#064e3b;--t3:#312e81;--t4:#431407;--ink:#f1f5f9;--mut:#94a3b8;--bg:#0f172a;--card-bg:#1e293b;--border:#64748b}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}
body{margin:0;font:400 16px/1.55 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg);transition:background .3s,color .3s;padding-bottom:120px}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;min-height:44px;min-width:44px}

/* ---- LOGIN ---- */
#lg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;color:#fff;overflow:hidden;background:linear-gradient(#ff9d6c 0%,#ffd08a 28%,#8fd3ea 62%,#0b7fa0 100%)}
#lg .card{position:relative;z-index:2;width:100%;max-width:380px;text-align:center;background:#ffffffe6;backdrop-filter:blur(10px);color:#17302d;border-radius:22px;padding:34px 26px;box-shadow:0 20px 60px #0a4a6340}
#lg h1{font-size:1.9rem;line-height:1.05;margin:0 0 6px;letter-spacing:-.02em}
#lg .sub2{color:#56696a;font-size:.95rem;margin:0 0 22px}
#lg input{width:100%;padding:14px 16px;font:500 1rem Figtree,sans-serif;border:2px solid #d3ded9;border-radius:12px;outline:none;text-align:center;background:#fff;color:#17302d;min-height:48px}
#lg input:focus{border-color:var(--c1)}
#lg .go{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--c1);color:#fff;font-weight:700;font-size:1rem}
#lg .adm{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--c2);color:#fff;font-weight:700;font-size:1rem}
#lerr{color:#c0392b;font-size:.88rem;margin-top:10px;min-height:1.2em}
.sun{position:absolute;left:50%;top:30%;width:140px;height:140px;margin-left:-70px;border-radius:50%;background:#fff3c4;box-shadow:0 0 90px 30px #ffe9a8aa;animation:rise 2.4s cubic-bezier(.2,.8,.2,1) both}
.plane{position:absolute;top:14%;left:0;width:52px;opacity:0;filter:drop-shadow(0 4px 8px rgba(10,74,99,.3));animation:fly 15s .8s ease-in-out both}
.plane svg{display:block;width:100%}
.cloud{position:absolute;border-radius:30px;background:#fff;opacity:.55;filter:blur(1px)}
.cl1{top:12%;width:130px;height:36px;animation:drift 58s linear infinite}
.cl2{top:24%;width:90px;height:26px;animation:drift 74s -30s linear infinite;opacity:.4}
.lwave{position:absolute;left:0;bottom:0;width:100%;height:30%}

/* ---- BARRA SUPERIOR ---- */
#bar{position:fixed;top:0;left:0;right:0;z-index:9;height:48px;padding:0 12px;display:none;align-items:center;gap:8px;background:var(--card-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
#bar.on{display:flex}
#lab{font-weight:600;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30%}
.bar-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
#who{font-size:.78rem;font-weight:700;color:var(--c1);background:var(--t1);padding:4px 10px;border-radius:20px;white-space:nowrap;cursor:pointer;border:1px solid var(--c1)}
#trk{position:relative;flex:1;height:6px;min-width:20px}
.sg{display:flex;height:100%;border-radius:3px;overflow:hidden}.sg i{display:block;height:100%}
#mk{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--c1);border:2.5px solid var(--bg);box-shadow:0 1px 4px #0005;transition:background .4s}
.btn-ico{background:none;border:0;font-size:1.1rem;padding:8px;border-radius:8px;color:var(--ink);display:grid;place-items:center}

/* ---- MODAL SELECTOR DE PERSONAS PROFESIONAL ---- */
#picker-modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.5);backdrop-filter:blur(5px);display:none;place-items:center;padding:20px}
#picker-modal.on{display:grid}
.picker-card{background:var(--card-bg);width:100%;max-width:420px;border-radius:20px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,0.2);border:1px solid var(--border);max-height:85vh;overflow-y:auto}
.picker-card h3{margin:0 0 4px;font-size:1.25rem;color:var(--c1)}
.picker-card p{margin:0 0 16px;font-size:0.88rem;color:var(--mut)}
.picker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.picker-item{background:var(--bg);border:1px solid var(--border);padding:12px;border-radius:12px;font-weight:600;font-size:0.9rem;text-align:center;cursor:pointer;transition:all 0.2s;color:var(--ink)}
.picker-item:hover{border-color:var(--c1);background:var(--t1);color:var(--c1)}
.picker-item.admin-action{grid-column:span 2;background:var(--t2);border-color:var(--c2);color:var(--c2)}
.picker-item.logout-action{grid-column:span 2;background:#fde8e8;border-color:#c0392b;color:#c0392b}
.picker-close{width:100%;padding:12px;border:0;border-radius:12px;background:var(--mut);color:#fff;font-weight:700;margin-top:8px}

/* ---- HERO ---- */
.hero{position:relative;min-height:92svh;display:grid;align-content:center;padding:24px;color:#fff;overflow:hidden;background:linear-gradient(#ff9d6c 0%,#ffd08a 28%,#8fd3ea 62%,#0b7fa0 100%)}
.hw{position:absolute;left:0;bottom:0;width:100%;height:34%}
.hint{position:absolute;left:0;right:0;bottom:36%;text-align:center;font-weight:600;font-size:.9rem;animation:bob 1.8s ease-in-out infinite}
.hero h1{font-weight:800;font-size:clamp(2.5rem,10vw,5.5rem);line-height:.98;letter-spacing:-.025em;margin:0 0 14px;max-width:9em;text-shadow:0 2px 24px #0a4a6366}
.hero .traveler-name-banner{display:inline-block;background:#ffffff33;padding:8px 18px;border-radius:14px;font-size:clamp(1.2rem,4vw,1.8rem);font-weight:800;margin-bottom:10px;backdrop-filter:blur(6px);border:1px solid #ffffff55;letter-spacing:-.01em;text-shadow:0 1px 8px #0a4a6366}
.hero p{max-width:30em;font-size:1.05rem;margin:0;text-shadow:0 1px 12px #0a4a6388}

/* ---- TARJETA BIENVENIDA ---- */
.welcome-card-wrap{position:relative;border-radius:16px;overflow:hidden;margin:16px auto;max-width:680px;border:1px solid var(--border);background:var(--card-bg);box-shadow:0 4px 12px rgba(0,0,0,.03)}
.welcome-card-wrap::before{content:"";position:absolute;inset:0;background-image:var(--bg-img);background-size:cover;background-position:center;opacity:0.18;pointer-events:none}
body.dark .welcome-card-wrap::before{opacity:0.12}
.welcome-card-content{position:relative;z-index:1;padding:20px}
.welcome-card-content h3{margin:0 0 6px;font-size:1.35rem;color:var(--c1)}
.welcome-card-content p{margin:0;color:var(--mut);font-size:.92rem;line-height:1.6}
.welcome-header-flex{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.welcome-caricature-big,.welcome-caricature-petro{width:100px;height:100px;flex:none;object-fit:cover;border-radius:50%}
.welcome-caricature-big{border:3px solid var(--c4);box-shadow:0 4px 14px rgba(160,86,29,0.25)}
.welcome-caricature-petro{border:3px solid var(--c1);box-shadow:0 4px 14px rgba(11,127,160,0.25)}
@media(min-width:768px){.welcome-caricature-big,.welcome-caricature-petro{width:120px;height:120px}}
.welcome-speech-bubble{position:relative;background:var(--card-bg);border:1px solid var(--border);padding:12px 16px;border-radius:14px;font-size:0.9rem;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,0.04);flex:1}

/* ---- DÍAS ---- */
.day{position:relative;background:var(--t)}
.bn{position:relative;height:200px;overflow:hidden;background:linear-gradient(var(--sk),var(--t))}
.sc{position:absolute;left:0;bottom:-30px;width:100%;height:170px;will-change:transform}
.cld{position:absolute;top:34px;left:0;width:120px;height:34px;border-radius:30px;background:#fff;opacity:.7;filter:blur(1px);animation:drift 46s linear infinite}
.num{position:absolute;left:max(16px,calc(50% - 340px));top:18px;font-weight:800;font-size:5.2rem;line-height:1;color:#fff;text-shadow:0 2px 18px #0005}
.in2{max-width:680px;margin:0 auto;padding:6px 16px 100px}
.dt{color:var(--mut);font-weight:500;margin:12px 0 0}
h2{font-weight:700;font-size:clamp(1.7rem,6vw,2.2rem);line-height:1.1;margin:4px 0 6px}
.v{font-size:1.05rem;font-style:italic;color:var(--c);font-weight:500;margin:0 0 8px}
.bd{display:inline-block;background:var(--c);color:#fff;font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:999px;margin:2px 0 4px}
.pn{margin:10px 0 0;padding:12px;border-left:4px solid var(--c);background:var(--card-bg);border-radius:0 9px 9px 0;font-size:.92rem;border:1px solid var(--border);border-left-width:4px}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:grid;grid-template-columns:5.6rem 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--border)}
li:first-child{border-top:0}.tm{font-weight:600;font-size:.9rem;color:var(--c)}
.n{margin:10px 0 0;padding:12px;border-left:4px solid var(--c);background:var(--card-bg);border-radius:0 9px 9px 0;font-size:.92rem;border:1px solid var(--border);border-left-width:4px}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}

/* ---- DESTINOS ---- */
.day-bg-wrap{position:relative;border-radius:14px;overflow:hidden;margin:12px 0;border:1px solid var(--border);background:var(--card-bg)}
.day-bg-wrap::before{content:"";position:absolute;inset:0;background-image:var(--bg-img);background-size:cover;background-position:center;opacity:0.18;pointer-events:none}
body.dark .day-bg-wrap::before{opacity:0.12}
.day-bg-content{position:relative;z-index:1;padding:14px 16px}

/* ---- PAGOS Y GASTOS ---- */
#v-pay,#v-gastos,#v-chk,#v-done,#v-adm,#v-stats{max-width:680px;margin:0 auto;padding:64px 16px 110px}
.tots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tot{background:var(--t4);border-radius:12px;padding:12px 8px;text-align:center}
.tot b{display:block;font-size:1.15rem;font-family:"Bricolage Grotesque",sans-serif}
.tot span{font-size:.72rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pday{margin-bottom:14px;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.pday>header{padding:12px 16px;background:var(--t);display:flex;justify-content:space-between;align-items:baseline}
.pday>header h3{margin:0;font-size:1.05rem;color:var(--ink)}
.pday>header span{font-size:.82rem;font-weight:600;color:var(--mut)}
.cat{padding:4px 16px 10px}
.cat h4{margin:10px 0 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.pay{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--border);user-select:none}
.pay:first-of-type{border-top:0}
.pay .bx{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--mut);display:grid;place-items:center;color:#fff;font-size:.85rem}
.pay.ok .bx{background:var(--c2);border-color:var(--c2)}
.pay.partial .bx{background:var(--c4);border-color:var(--c4)}
.pay .nm{flex:1;font-size:.92rem}
.pay .am{font-weight:700;font-size:.9rem;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.abonar-btn{background:var(--t1);color:var(--c1);border:1px solid var(--c1);padding:6px 10px;border-radius:8px;font-size:.75rem;font-weight:700;min-height:36px}

/* ---- CHECKLISTS ---- */
.chk-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.chk-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.chk-item:first-child{border-top:0}
.chk-item input{width:24px;height:24px;accent-color:var(--c1);min-height:24px;min-width:24px}
.chk-item span{font-weight:500;font-size:.94rem}
.chk-item.done span{text-decoration:line-through;color:var(--mut)}

/* ---- ESTADÍSTICAS & ADMIN DETALLADAS ---- */
.stat-box{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.stat-box h3{margin-top:0;font-size:1.15rem;color:var(--c1)}
.person-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:.92rem;cursor:pointer;transition:background 0.2s}
.person-row:hover{background:var(--t1);padding-left:8px;padding-right:8px;border-radius:8px}
.person-row:last-child{border-bottom:0}
.person-detail-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px;display:none}
.person-detail-card.open{display:block}

/* ---- MENÚ INFERIOR ---- */
#menu{position:fixed;left:0;right:0;bottom:0;z-index:10;display:none;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--card-bg);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,0.08)}
body.in #menu{display:grid}
#menu button{border:0;background:none;padding:6px 2px;border-radius:12px;font:600 .68rem Figtree,sans-serif;color:var(--mut);display:grid;gap:3px;justify-items:center;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);position:relative;min-height:48px}
#menu button svg{width:20px;height:20px;transition:transform 0.25s cubic-bezier(0.4,0,0.2,1)}
#menu button.on{color:var(--c1);background:var(--t1)}
#menu button.on svg{transform:translateY(-2px) scale(1.15)}

#menu button.neon-btn{
  background: linear-gradient(135deg, #0b7fa0 0%, #38bdf8 100%);
  color: #fff;
  border-radius: 50%;
  width: 52px;
  height: 52px;
  min-width: 52px;
  min-height: 52px;
  margin: -16px auto 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(11, 127, 160, 0.4), 0 0 0 3px var(--bg);
  border: 2px solid #ffffff;
  font-size: 1.6rem;
  font-weight: 800;
  cursor: pointer;
}

/* Visibilidad de botones en modo Normal vs Admin */
body.admin #menu button.neon-btn { display: none !important; }
body.admin #menu button[data-v="chk"], body.admin #menu button[data-v="done"] { display: none !important; }

/* Botones exclusivos de Admin en el Menú (Ocultos por defecto para usuarios normales) */
#m-switch, #m-exit { display: none !important; }
body.admin #m-switch, body.admin #m-exit { display: grid !important; }
body.admin #menu { grid-template-columns: repeat(6, 1fr); }

body:not(.admin) #m-adm, body:not(.admin) #m-stats{display:none}

/* ---- PIE DE PÁGINA (FOOTER) ---- */
#footer-brand{text-align:center;padding:30px 16px 20px;color:var(--mut);font-size:0.88rem;border-top:1px solid var(--border);margin-top:40px;background:var(--card-bg)}
#footer-brand b{color:var(--c1)}

/* ---- ADMIN GESTIÓN ---- */
.aprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.aprow b{flex:1 1 110px}
.aprow select{padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;font:500 .85rem Figtree,sans-serif;background:var(--bg);color:var(--ink);min-height:42px}

@keyframes rise{from{transform:translateY(170px) scale(.92);opacity:0}}
@keyframes fly{0%{transform:translate(-100px,42px) rotate(7deg);opacity:0}7%{opacity:1}32%{transform:translate(30vw,8px) rotate(1deg)}58%{transform:translate(56vw,-12px) rotate(-3deg)}85%{opacity:1}100%{transform:translate(calc(100vw + 100px),-44px) rotate(-7deg);opacity:0}}
@keyframes bob{50%{transform:translateY(8px)}}
@keyframes drift{to{transform:translateX(110vw)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
.alt-bd{display:inline-flex;align-items:center;gap:4px;background:var(--card-bg);color:var(--mut);border:1px solid var(--border);font-size:.78rem;font-weight:700;padding:4px 12px;border-radius:999px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="lg">
  <div class="sun"></div><div class="cloud cl1"></div><div class="cloud cl2"></div>
  <div class="plane"><svg viewBox="0 0 64 32"><g fill="#fff"><path d="M4 14h50c6 0 8 2 8 2s-2 2-8 2H4z"/><path d="M26 15 18 2h6l16 13zM26 17l-8 13h6l16-13z"/><path d="M8 15 3 7h4l7 8zM8 17l-5 8h4l7-8z"/></g></svg></div>
  <svg class="lwave" viewBox="0 0 800 150" preserveAspectRatio="xMidYMax slice"><g style="animation:wv1 5s linear infinite"><path d="M0 90 q25 -22 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V150H0Z" fill="#fff" opacity=".35"/></g><g style="animation:wv2 7s linear infinite"><path d="M0 112 q30 -18 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V150H0Z" fill="#bfe8f6"/></g></svg>
  <div class="card">
    <h1 style="margin-bottom:2px">Del Caribe al Eje Cafetero</h1>
    <div style="font-weight:800;color:#0b7fa0;font-size:0.85rem;margin-bottom:14px;text-transform:uppercase;letter-spacing:1px">by Rosa & Kalen 💛</div>
    <p class="sub2">2 al 12 de octubre de 2026<br>Escribe tu nombre o código para ver tu viaje</p>
    <input id="lin" placeholder="Nombre o código" autocomplete="off" autocapitalize="none">
    <button class="go" id="lgo">Entrar</button>
    <div id="lerr"></div>
    <button class="adm" id="ladm">Admin (Contraseña)</button>
  </div>
</div>

<!-- MODAL SELECTOR DE PERSONAS / CAMBIAR / SALIR -->
<div id="picker-modal">
  <div class="picker-card">
    <h3>Menú de Viajero</h3>
    <p>Elige un perfil para ver su viaje o entra como administrador:</p>
    <div class="picker-grid" id="picker-list"></div>
    <button class="picker-close" id="picker-cancel">Cancelar</button>
  </div>
</div>

<!-- APP BAR -->
<div id="bar">
  <span id="lab">Inicio</span>
  <div id="trk"><div class="sg" id="sg"></div><div id="mk"></div></div>
  <div class="bar-actions">
    <button class="btn-ico" id="dark-toggle" title="Modo Oscuro">🌙</button>
    <span id="who" title="Cambiar de usuario">Cargando...</span>
  </div>
</div>

<div id="v-hero"></div>
<main id="app"></main>
<div id="v-pay"></div>
<div id="v-gastos"></div>
<div id="v-chk"></div>
<div id="v-done"></div>
<div id="v-stats"></div>
<div id="v-adm"></div>

<!-- PIE DE PÁGINA -->
<footer id="footer-brand" style="display:none">
  <div>by Rosa & Kalen 💛 &nbsp;|&nbsp; <b>@pintroute</b></div>
</footer>

<!-- MENÚ INFERIOR -->
<div id="menu">
  <button data-v="itin" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2.5-7.5z"/></svg>Itinerario</button>
  <button data-v="pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Pagos</button>

}

function getDailyMsg(arrList, seedStr){
  let hash = 0;
  for (let i = 0; i < seedStr.length; i++) {
    hash = (hash << 5) - hash + seedStr.charCodeAt(i);
    hash |= 0;
  }
  return arrList[Math.abs(hash) % arrList.length];
}

async function loadFromSupabase(){
  try {
    const { data } = await supabaseClient.from('traveler_data').select('*');
    if(data && data.length > 0){
      data.forEach(row => {
        const p = D.people.find(x => x.id === row.id);
        if(p && row.data){
          p.paid = row.data.paid || {};
          p.chk = row.data.chk || {};
          p.done = row.data.done || {};
          p.gastos = row.data.gastos || [];
          p.who = row.data.who || p.who;
          p.arr = row.data.arr || p.arr;
          p.ret = row.data.ret || p.ret;
        }
      });
    }
  } catch(e){ console.error("Error al cargar de Supabase", e); }
}

async function saveToSupabase(p){
  try {
    await supabaseClient.from('traveler_data').upsert({
      id: p.id,
      name: p.name,
      data: { paid: p.paid, chk: p.chk, done: p.done, gastos: p.gastos, who: p.who, arr: p.arr, ret: p.ret },
      updated_at: new Date()
    });
  } catch(e){ console.error("Error al guardar en Supabase", e); }
}

  if(w==="g2")return p.who==="g2";
  if(w==="g1_fly")return p.who==="g1" && p.arr!=="copey3";
  if(w==="g1_explora")return p.who==="g1" && p.code!=="loly r" && p.code!=="hector";
  if(w.startsWith("arr:"))return p.arr===w.slice(4);
  if(w.startsWith("ret:"))return p.ret===w.slice(4);
  return false;
}
function myPays(p){return D.pays.filter(x=>applies(x,p))}

function getProfileDesc(p){
  let t = `<b>Perfil de Viajero:</b> `;
  if(p.arr==="baq")t+="Sales el 2 de octubre desde Barranquilla. ";
  else if(p.arr==="copey")t+="Sales el 2 de octubre desde El Copey hacia Santa Marta ($40.000). ";
  else if(p.arr==="copey3")t+="Viajas desde El Copey en la madrugada del día 3 hacia Santa Marta ($40.000). ";
  else if(p.arr==="baq_g2")t+="Grupo 2: viajas el 8 de octubre de Barranquilla a Bogotá y directo a Pereira. ";
  if(p.ret==="baq" && p.arr==="copey")t+="Regresas a Barranquilla el 12 y viajas al día siguiente a El Copey.";
  else if(p.ret==="baq")t+="Regresas el 12 en vuelo directo Pereira → Barranquilla.";
  else if(p.ret==="smt")t+="Regresas el 12 de Pereira a Santa Marta y viajas hacia El Copey.";
  return t;
}

function pnote(d,p){
  if(d.n===2){
    if(p.arr==="baq")return "<b>Tu plan:</b> sales de Barranquilla hacia Santa Marta y duermes en El Rodadero.";
    if(p.arr==="copey")return "<b>Tu plan:</b> viajas desde El Copey hasta Santa Marta ($40.000).";
    if(p.arr==="copey3")return "<b>Tu plan:</b> viaje a Santa Marta en la madrugada de mañana.";
    return "<b>Tu plan:</b> viajas el 8 de octubre.";
  }
  if(d.n===3 && (p.code==="loly r"||p.code==="hector"))return "<b>Tu plan:</b> tarde libre / pendiente por definir (sin Parque Explora).";
  if(d.n===8 && p.arr==="baq_g2")return "<b>Tu plan:</b> vuelo Baq-Bog-Pereira, encuentro a la 1 PM para almorzar y termales.";
  return "";
}

function renderPay(){
  if(!ME) return;
  const mine=myPays(ME);
  const est=mine.reduce((a,x)=>a+(+x.amt||0),0);
  let paid=0;
  mine.forEach(x=>{
    const pInfo=ME.paid[x.id];
    if(typeof pInfo==="number")paid+=pInfo;
    else if(pInfo===true)paid+=(+x.amt||0);
  });
  const pct=est>0?Math.round((paid/est)*100):0;
  const byDay={}; mine.forEach(x=>{(byDay[x.day]=byDay[x.day]||[]).push(x)});

  let subtitleText = ADMIN ? `Modo Administrador gestionando a <b>${ME.name}</b>.` : `Estado financiero de <b>${ME.name}</b>.`;
  let h=`<div class="welcome-card-wrap" style="margin-top:20px; --bg-img: url('${ME.arr==="copey"||ME.arr==="copey3"?"El Copey.jpg":"Barranquilla.jpg"}')"><div class="welcome-card-content">
    <h3>💰 Pagos y Abonos de ${ME.name}</h3><p>${subtitleText}<br><b>Progreso:</b> ${pct}% pagado</p>
    <div style="background:var(--border);height:8px;border-radius:4px;margin-top:12px;overflow:hidden">
    <div style="background:var(--c2);width:${pct}%;height:100%;transition:width 0.6s ease-out"></div></div></div></div>`;

  h+=`<div class="tots"><div class="tot"><b>${fmt(est)}</b><span>Total Ruta</span></div><div class="tot" style="background:var(--t2)"><b style="color:var(--c2)">${fmt(paid)}</b><span>Abonado</span></div><div class="tot" style="background:var(--t1)"><b style="color:var(--c1)">${fmt(Math.max(est-paid,0))}</b><span>Saldo</span></div></div>`;

  Object.keys(byDay).sort((a,b)=>a-b).forEach(day=>{
    const dd=D.days.find(x=>x.n==day);
    const items=byDay[day];
    const cats={}; items.forEach(x=>{(cats[x.cat]=cats[x.cat]||[]).push(x)});
    h+=`<div class="pday" style="--t:var(--t${dd?dd.r:4});--c:var(--c${dd?dd.r:4})"><header><h3>${dd?dd.dt:"Día "+day}</h3></header>`;
    Object.keys(cats).forEach(c=>{
      h+=`<div class="cat"><h4>${c}</h4>${cats[c].map(x=>{
        const pi=ME.paid[x.id];
        const full=(pi===true||(typeof pi==="number"&&pi>=x.amt));
        const partial=(typeof pi==="number"&&pi>0&&pi<x.amt);
        const cls=full?"ok":(partial?"partial":"");
        const paidAmt=typeof pi==="number"?pi:(pi===true?x.amt:0);
        return `<div class="pay ${cls}" data-id="${x.id}">
          <span class="bx" style="${ADMIN?'cursor:pointer':''}" title="${ADMIN?'Marcar pagado':''}">${full?"✓":(partial?"~":"")}</span>
          <span class="nm">${x.item}${partial?`<small style="color:var(--c4)">Abonado: ${fmt(paidAmt)}</small>`:""}</span>
          <span class="am">${fmt(x.amt)}${ADMIN?`<button class="abonar-btn" data-abonar="${x.id}">Abonar</button>`:""}</span>
        </div>`;
      }).join("")}</div>`;
    });
    h+=`</div>`;
  });
  $("v-pay").innerHTML=h;

  if(ADMIN){
    $("v-pay").querySelectorAll(".bx").forEach(bx=>{
      bx.onclick=e=>{
        const id=e.target.closest(".pay").dataset.id;
        if(ME.paid[id]===true){delete ME.paid[id];snd("click")}else{ME.paid[id]=true;snd("ok")}
        save();renderPay();
      };
    });
    $("v-pay").querySelectorAll("[data-abonar]").forEach(btn=>{
      btn.onclick=e=>{
        const id=e.target.dataset.abonar;
        const x=D.pays.find(p=>p.id===id);
        const cur=typeof ME.paid[id]==="number"?ME.paid[id]:(ME.paid[id]?x.amt:0);
        const val=prompt(`Ingresa abono para "${x.item}" (Total: ${fmt(x.amt)}):`,cur);
        if(val!==null){
          const num=parseInt(val.replace(/\D/g,""))||0;
          if(num<=0)delete ME.paid[id]; else if(num>=x.amt)ME.paid[id]=true; else ME.paid[id]=num;
          snd("ok");save();renderPay();
        }
      };
    });
  }
}

    h+=`<div class="chk-item" style="display:flex; justify-content:space-between; align-items:center;">
      <span>${g.desc}</span>
      <div style="display:flex; align-items:center; gap:12px;"><b style="color:var(--c1);">${fmt(g.amt)}</b>

  });

  $("v-gastos").innerHTML=h;

  const amtInput = $("v-gastos").querySelector("#g-amt");
  amtInput.oninput = (e) => {

      e.target.value = "";

  $("v-gastos").querySelectorAll(".del-gasto").forEach(btn=>{

        ME.gastos.splice(parseInt(btn.dataset.idx),1);
        snd("click"); save(); renderGastos();
      }
    };
  });
}

let io=null, secs=[], scs=[];
function bindScrollFx(){
  secs=[...document.querySelectorAll(".day")]; scs=secs.map(s=>s.querySelector(".sc"));
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
}

function onS(){
  const y=scrollY, max=document.documentElement.scrollHeight-innerHeight;
  $("bar").classList.toggle("on", y>innerHeight*.55);
  $("mk").style.left=(max>0?y/max*100:0)+"%";
  let a=null; secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.4)a=i});
  if(a!==null){const d=activeDays[a]||D.days[a];if(d){$("lab").textContent="Día "+d.n+": "+d.t;$("mk").style.background="var(--c"+d.r+")"}}
}
addEventListener("scroll",onS,{passive:true});

  $("v-adm").style.display = v==="adm"?"":"none";
  $("bar").style.display = v==="itin"?"":"none";
  $("footer-brand").style.display = "block";
  scrollTo(0,0); onS();
}

document.querySelectorAll("#menu button[data-v]").forEach(b=>b.onclick=async()=>{
  const v=b.dataset.v;
  if(!ADMIN && (v==="adm"||v==="stats")) return;
  await loadFromSupabase(); show(v);
  if(v==="itin") renderItin(); else if(v==="pay") renderPay(); else if(v==="gastos") renderGastos();
  else if(v==="chk") renderChk(); else if(v==="done") renderDone(); else if(v==="stats") renderStats(); else if(v==="adm") renderAdm();
});

async function enter(p){
  await loadFromSupabase(); ME=p; ADMIN=false; activeDays=getTravelerDays(ME);
  document.body.classList.remove("admin"); document.body.classList.add("in");
  $("lg").style.display="none"; 
  $("who").textContent = `👤 ${p.name}`;
  renderItin(); renderPay(); renderGastos(); renderChk(); renderDone(); renderStats(); show("itin"); snd("ok");
}

function logout(){
  ADMIN=false; ME=null; activeDays=D.days;
  document.body.classList.remove("in","admin");
  $("lg").style.display="grid"; $("lin").value=""; $("lerr").textContent=""; $("footer-brand").style.display="none"; snd("click");
}

async function askAdmin(){
  let pwd = prompt("Contraseña de administrador:");
  if(pwd===PASS){
    await loadFromSupabase(); ADMIN=true; ME=D.people[0]; activeDays=getTravelerDays(ME);
    document.body.classList.add("admin","in");
    $("lg").style.display="none"; 
    $("who").textContent="⚡ Admin";
    renderItin(); renderPay(); renderGastos(); renderChk(); renderDone(); renderStats(); renderAdm();
    show("stats"); snd("ok");
  }else if(pwd!==null){ alert("Contraseña incorrecta"); }
}

function openPicker(){
  const list = $("picker-list");
  let itemsHtml = D.people.map(p=>`<div class="picker-item" data-id="${p.id}">${p.name}</div>`).join("");
  itemsHtml += `<div class="picker-item admin-action" id="picker-admin">⚡ Entrar como Admin</div>`;
  if(ME){
    itemsHtml += `<div class="picker-item logout-action" id="picker-logout">🚪 Salir / Cambiar usuario</div>`;
  }
  list.innerHTML = itemsHtml;
  $("picker-modal").classList.add("on");

  list.querySelectorAll(".picker-item:not(.admin-action):not(.logout-action)").forEach(item=>{
    item.onclick = async () => {
      const p = D.people.find(x=>x.id===item.dataset.id);
      $("picker-modal").classList.remove("on");
      await enter(p);
    };
  });

  $("picker-admin").onclick = () => {
    $("picker-modal").classList.remove("on");
    askAdmin();
  };

  const logoutBtn = $("picker-logout");
  if(logoutBtn){
    logoutBtn.onclick = () => {
      $("picker-modal").classList.remove("on");
      logout();
    };
  }
}

$("picker-cancel").onclick = () => { $("picker-modal").classList.remove("on"); };
$("who").onclick = openPicker;
$("m-switch").onclick = openPicker;
$("m-exit").onclick = logout;

function tryLogin(){
  const val=$("lin").value.trim().toLowerCase();
  if(!val)return;
  if(val===PASS || val==="admin" || val==="kalen2026"){
    askAdmin(); return;
  }
  const p=D.people.find(x=>x.name.toLowerCase()===val || x.code.toLowerCase()===val);
  if(p){ $("lerr").textContent=""; enter(p); }
  else{ $("lerr").textContent="Nombre o código no reconocido."; }
}

$("lgo").onclick=tryLogin;
$("lin").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin()});
$("ladm").onclick=askAdmin;
</script>
</body>
</html>
