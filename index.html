<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Del Caribe al Eje Cafetero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--c1:#0b7fa0;--c2:#2a8a4a;--c3:#5865b0;--c4:#a0561d;--t1:#e3f4fa;--t2:#e7f4e9;--t3:#e9ecf8;--t4:#f7ece1;--ink:#17302d;--mut:#56696a}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:400 16px/1.55 Figtree,system-ui,sans-serif;color:var(--ink);background:#fff}
body.admin{padding-bottom:118px}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
button{font-family:inherit}
/* ---- LOGIN ---- */
#lg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;color:#fff;overflow:hidden;background:linear-gradient(#ff9d6c 0%,#ffd08a 28%,#8fd3ea 62%,#0b7fa0 100%)}
#lg .card{position:relative;z-index:2;width:100%;max-width:380px;text-align:center;background:#ffffffe6;backdrop-filter:blur(10px);color:var(--ink);border-radius:22px;padding:34px 26px;box-shadow:0 20px 60px #0a4a6340}
#lg h1{font-size:1.9rem;line-height:1.05;margin:0 0 6px;letter-spacing:-.02em}
#lg .sub2{color:var(--mut);font-size:.95rem;margin:0 0 22px}
#lg input{width:100%;padding:13px 16px;font:500 1rem Figtree,sans-serif;border:2px solid var(--line,#d3ded9);border-radius:12px;outline:none;text-align:center;background:#fff;color:var(--ink)}
#lg input:focus{border-color:var(--c1)}
#lg .go{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--c1);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
#lg .go:active{transform:scale(.98)}
#lg .adm{margin-top:14px;background:none;border:0;color:var(--mut);font-size:.85rem;cursor:pointer;text-decoration:underline}
#lerr{color:#c0392b;font-size:.88rem;margin-top:10px;min-height:1.2em}
.sun{position:absolute;left:50%;top:30%;width:140px;height:140px;margin-left:-70px;border-radius:50%;background:#fff3c4;box-shadow:0 0 90px 30px #ffe9a8aa;animation:rise 2.4s cubic-bezier(.2,.8,.2,1) both}
.plane{position:absolute;top:14%;left:0;width:52px;opacity:0;filter:drop-shadow(0 4px 8px rgba(10,74,99,.3));animation:fly 15s .8s ease-in-out both}
.plane svg{display:block;width:100%}
.cloud{position:absolute;border-radius:30px;background:#fff;opacity:.55;filter:blur(1px)}
.cl1{top:12%;width:130px;height:36px;animation:drift 58s linear infinite}
.cl2{top:24%;width:90px;height:26px;animation:drift 74s -30s linear infinite;opacity:.4}
.lwave{position:absolute;left:0;bottom:0;width:100%;height:30%}
/* ---- BARRA SUPERIOR ---- */
#bar{position:fixed;top:0;left:0;right:0;z-index:9;height:46px;padding:0 16px;display:none;align-items:center;gap:14px;background:#ffffffd9;backdrop-filter:blur(8px)}
#bar.on{display:flex}
#lab{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
#who{margin-left:auto;font-size:.82rem;font-weight:600;color:var(--mut);white-space:nowrap}
#trk{position:relative;flex:1;height:8px;min-width:60px}
.sg{display:flex;height:100%;border-radius:4px;overflow:hidden}.sg i{display:block;height:100%}
#mk{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--c1);border:3px solid #fff;box-shadow:0 1px 5px #0005;transition:background .4s}
/* ---- HERO ---- */
.hero{position:relative;min-height:92svh;display:grid;align-content:center;padding:24px;color:#fff;overflow:hidden;background:linear-gradient(#ff9d6c 0%,#ffd08a 28%,#8fd3ea 62%,#0b7fa0 100%)}
.hw{position:absolute;left:0;bottom:0;width:100%;height:34%}
.hint{position:absolute;left:0;right:0;bottom:36%;text-align:center;font-weight:600;font-size:.9rem;animation:bob 1.8s ease-in-out infinite}
.hero h1{font-weight:800;font-size:clamp(2.7rem,11vw,6rem);line-height:.98;letter-spacing:-.025em;margin:0 0 14px;max-width:9em;text-shadow:0 2px 24px #0a4a6366}
.hero p{max-width:30em;font-size:1.12rem;margin:0;text-shadow:0 1px 12px #0a4a6388}
/* ---- DÍAS ---- */
.day{position:relative;background:var(--t)}
.bn{position:relative;height:210px;overflow:hidden;background:linear-gradient(var(--sk),var(--t))}
.sc{position:absolute;left:0;bottom:-30px;width:100%;height:180px;will-change:transform}
.cld{position:absolute;top:34px;left:0;width:120px;height:34px;border-radius:30px;background:#fff;opacity:.7;filter:blur(1px);animation:drift 46s linear infinite}
.num{position:absolute;left:max(20px,calc(50% - 340px));top:22px;font-weight:800;font-size:5.6rem;line-height:1;color:#fff;text-shadow:0 2px 18px #0005}
.in2{max-width:680px;margin:0 auto;padding:6px 20px 64px}
.dt{color:var(--mut);font-weight:500;margin:14px 0 0}
h2{font-weight:700;font-size:clamp(1.8rem,6.5vw,2.4rem);line-height:1.1;margin:4px 0 6px}
.v{font-size:1.12rem;font-style:italic;color:var(--c);font-weight:500;margin:0 0 8px}
.bd{display:inline-block;background:var(--c);color:#fff;font-size:.82rem;font-weight:600;padding:2px 12px;border-radius:999px;margin:2px 0 4px}
.pn{margin:10px 0 0;padding:9px 13px;border-left:4px solid var(--c);background:#ffffffd8;border-radius:0 9px 9px 0;font-size:.94rem}
.pn b{font-weight:600}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:grid;grid-template-columns:5.4rem 1fr;gap:10px;padding:9px 0;border-top:1px solid #17302d1f}
li:first-child{border-top:0}.tm{font-weight:600;font-size:.92rem;color:var(--c)}
.n{margin:10px 0 0;padding:9px 13px;border-left:4px solid var(--c);background:#ffffffb8;border-radius:0 9px 9px 0;font-size:.94rem}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
/* ---- PAGOS ---- */
#v-pay{max-width:680px;margin:0 auto;padding:74px 20px 90px}
.tots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.tot{background:var(--t4);border-radius:14px;padding:12px;text-align:center}
.tot b{display:block;font-size:1.35rem;font-family:"Bricolage Grotesque",sans-serif}
.tot span{font-size:.78rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pday{margin-bottom:16px;background:#fff;border:1px solid #17302d1f;border-radius:16px;overflow:hidden}
.pday>header{padding:12px 16px;background:var(--t);display:flex;justify-content:space-between;align-items:baseline}
.pday>header h3{margin:0;font-size:1.1rem}
.pday>header span{font-size:.85rem;font-weight:600;color:var(--mut)}
.cat{padding:4px 16px 10px}
.cat h4{margin:8px 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.pay{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed #17302d1f;cursor:pointer;user-select:none}
.pay:first-of-type{border-top:0}
.pay .bx{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;color:#fff;font-size:.8rem;transition:all .15s}
.pay.ok .bx{background:var(--c2);border-color:var(--c2)}
.pay .nm{flex:1;font-size:.94rem}
.pay .am{font-weight:700;font-size:.92rem;white-space:nowrap}
.pay .am small{display:block;font-weight:500;color:var(--mut);font-size:.72rem;text-align:right}
.pay.locked{cursor:default}
/* ---- MENÚ INFERIOR ---- */
#menu{position:fixed;left:0;right:0;bottom:0;z-index:10;display:none;gap:4px;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid #17302d1f;padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
body.in #menu{display:flex}
#menu button{flex:1;border:0;background:none;padding:8px 4px;border-radius:12px;font:600 .82rem Figtree,sans-serif;color:var(--mut);cursor:pointer;display:grid;gap:2px;justify-items:center}
#menu button svg{width:20px;height:20px}
#menu button.on{color:var(--c1);background:var(--t1)}
/* ---- ADMIN ---- */
#v-adm{max-width:680px;margin:0 auto;padding:74px 20px 90px}
#v-adm h2{margin-top:24px}
.aprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid #17302d1f;border-radius:14px;padding:12px;margin-bottom:10px}
.aprow b{flex:1 1 120px}
.aprow input,.aprow select{padding:7px 10px;border:1.5px solid #17302d1f;border-radius:9px;font:500 .88rem Figtree,sans-serif;background:#fff;color:var(--ink)}
.aprow .del{border:0;background:#fdecea;color:#c0392b;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer}
#addp{display:grid;gap:8px;background:var(--t1);border-radius:14px;padding:14px;margin-bottom:8px}
#addp input{padding:10px 12px;border:1.5px solid #17302d1f;border-radius:10px;font:500 .95rem Figtree,sans-serif}
#addp .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#addp button{padding:11px;border:0;border-radius:10px;background:var(--c1);color:#fff;font-weight:700;cursor:pointer}
.atools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 20px}
.atools button{border:0;border-radius:10px;padding:9px 14px;font:600 .85rem Figtree,sans-serif;background:#17302d;color:#fff;cursor:pointer}
.atools .rs{background:#a0561d}
.paidall{font-size:.75rem;color:var(--mut)}
@keyframes rise{from{transform:translateY(170px) scale(.92);opacity:0}}
@keyframes fly{0%{transform:translate(-100px,42px) rotate(7deg);opacity:0}7%{opacity:1}32%{transform:translate(30vw,8px) rotate(1deg)}58%{transform:translate(56vw,-12px) rotate(-3deg)}85%{opacity:1}100%{transform:translate(calc(100vw + 100px),-44px) rotate(-7deg);opacity:0}}
@keyframes bob{50%{transform:translateY(8px)}}
@keyframes drift{to{transform:translateX(110vw)}}
@keyframes wv1{to{transform:translateX(-100px)}}@keyframes wv2{to{transform:translateX(-120px)}}
@keyframes mist{to{transform:translateX(120px)}}
@media(max-width:480px){.num{font-size:4.4rem}li{grid-template-columns:4.6rem 1fr}.tots{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style><base target="_blank">
</head>

const fmt=n=>"$"+(n||0).toLocaleString("es-CO");
const $=id=>document.getElementById(id);
let ME=null,ADMIN=false;

/* ---------- helpers de escenarios ---------- */
const rp=(s,n)=>s.repeat(n);
const wave=(a,o1,b,o2)=>`<g style="animation:wv1 5s linear infinite"><path d="M0 90 ${rp("q25 -22 50 0 t50 0 ",24)}V150H0Z" fill="${a}" opacity="${o1}"/></g><g style="animation:wv2 7s linear infinite"><path d="M0 112 ${rp("q30 -18 60 0 t60 0 ",20)}V150H0Z" fill="${b}" opacity="${o2}"/></g>`;
const hills=()=>`<path d="M0 100C150 40 300 120 450 80S700 50 800 90V150H0Z" fill="var(--c2)" opacity=".4"/><path d="M0 122C200 82 350 142 520 107S720 92 800 117V150H0Z" fill="var(--c2)"/>`+[90,210,330,470,610,720].map((x,i)=>`<rect x="${x}" y="${118-(i%3)*5}" width="12" height="9" fill="${["#f4b942","#e4572e","#fff","#3b9ac4"][i%4]}"/>`).join("");
const peaks=()=>`<path d="M0 150L120 70 200 110 330 30 430 100 560 55 680 105 800 70V150Z" fill="var(--c3)" opacity=".45"/><path d="M330 30L300 58 318 52 330 63 345 51 362 59Z" fill="#fff"/><path d="M0 132Q200 105 400 128T800 118V150H0Z" fill="var(--c3)"/>`+[60,150,260,520,640,740].map((x,i)=>`<rect x="${x}" y="${118+(i%2)*4}" width="4" height="16" fill="#5b5340"/><circle cx="${x+2}" cy="${116+(i%2)*4}" r="7" fill="#9fb27a"/>`).join("")+`<ellipse cx="300" cy="100" rx="170" ry="14" fill="#fff" opacity=".45" style="animation:mist 14s ease-in-out infinite alternate"/>`;
const palms=()=>`<path d="M0 100C200 70 380 120 560 90S740 80 800 100V150H0Z" fill="#7aa66a" opacity=".6"/><path d="M0 125Q200 95 400 120T800 110V150H0Z" fill="#4f8a43"/>`+[80,210,350,500,640,730].map((x,i)=>{const t=38+(i%3)*12,c=x+1.5,e=`<ellipse cx="${c}" cy="${t}" rx="15" ry="3.5"`;return `<rect x="${x}" y="${t}" width="3" height="${112-t}" fill="#6b4a2b"/><g fill="#3f7d3a">${e}/>${e} transform="rotate(35 ${c} ${t})"/>${e} transform="rotate(-35 ${c} ${t})"/></g>`}).join("");
const SC={1:()=>wave("var(--c1)",.35,"var(--c1)",1),2:hills,3:peaks,4:palms};

/* ---------- a quién aplica un pago ---------- */
function applies(pay,p){
  const w=pay.w;
  if(w==="all")return true;
  if(w==="g1"||w==="g2")return p.who===w;
  if(w.startsWith("arr:"))return p.arr===w.slice(4);
  if(w.startsWith("ret:"))return p.ret===w.slice(4);
  return false;
}
function myPays(p){return D.pays.filter(x=>applies(x,p))}

/* ---------- notas personalizadas por día ---------- */
function pnote(d,p){
  if(d.n===2){
    if(p.arr==="baq")return "<b>Tu plan:</b> sales de Barranquilla hacia Santa Marta y duermes en El Rodadero.";
    if(p.arr==="copey")return "<b>Tu plan:</b> viajas desde El Copey (Cesar) hasta Santa Marta y duermes en El Rodadero.";
    return "<b>Tu plan:</b> tú viajas el 8. Este día lo pasa el grupo 1 en El Rodadero.";
  }
  if(d.n===3&&p.who==="g2")return "<b>Tu plan:</b> tu viaje empieza el 8 de octubre. El grupo 1 vuela hoy a Medellín.";
  if(d.n===8&&p.arr==="g2")return "<b>Tu plan:</b> hoy llegas — vuelo 9:35 AM con escala en Bogotá, aterrizas en Pereira ~1:00 PM. Encuentro con todos en el hotel a las 2 PM, luego termales.";
  if(d.n===8&&p.who==="g2")return "<b>Hoy se une el grupo 2:</b> aterrizan en Pereira ~1:00 PM.";
  if(d.n===12&&p.ret==="smt")return "<b>Tu plan:</b> regresas a Santa Marta (no tomas el vuelo a Barranquilla).";
  return "";
}

/* ---------- render: hero + itinerario ---------- */
function renderItin(){
  $("v-hero").innerHTML=`<header class="hero" id="hero"><div class="sun"></div><div class="cloud cl1"></div><div class="cloud cl2"></div>
  <div class="plane"><svg viewBox="0 0 64 32"><g fill="#fff"><path d="M4 14h50c6 0 8 2 8 2s-2 2-8 2H4z"/><path d="M26 15 18 2h6l16 13zM26 17l-8 13h6l16-13z"/><path d="M8 15 3 7h4l7 8zM8 17l-5 8h4l7-8z"/></g></svg></div>
  <div style="position:relative;z-index:2;max-width:760px;margin:0 auto;width:100%"><h1>${D.title}</h1><p>${D.sub}</p></div>
  <div class="hint">Desliza para empezar</div>
  <svg class="hw" viewBox="0 0 800 150" preserveAspectRatio="xMidYMax slice">${wave("#fff",.35,SK[1],1)}</svg></header>`;
  $("app").innerHTML=D.days.map((d,i)=>{
    const note=pnote(d,ME);
    return `<section class="day" id="d${d.n}" style="--c:var(--c${d.r});--t:var(--t${d.r});--sk:${SK[d.r]}"><div class="bn"><div class="cld" style="animation-delay:-${i*9}s"></div><svg class="sc" viewBox="0 0 800 150" preserveAspectRatio="xMidYMax slice">${SC[d.r]()}</svg><span class="num">${d.n}</span></div><div class="in2"><p class="dt rv">${d.dt}</p><h2 class="rv">${d.t}</h2><p class="v rv">${d.v}</p>${d.b?`<span class="bd rv">${d.b}</span>`:""}${note?`<p class="pn rv" style="--c:var(--c${d.r})">${note}</p>`:""}<ul>${d.s.map(s=>`<li class="rv"><span class="tm">${s[0]}</span><span>${s[1]}</span></li>`).join("")}</ul>${d.h?`<p class="n rv" style="--c:var(--c${d.r})"><b>Dormir:</b> ${d.h}</p>`:""}${d.k?`<p class="n rv" style="--c:var(--c${d.r})"><b>Ojo:</b> ${d.k}</p>`:""}</div></section>`}).join("");
  $("sg").innerHTML=[1,2,3,4].map(r=>`<i style="flex:${D.days.filter(d=>d.r===r).length};background:var(--c${r})"></i>`).join("");
  bindScrollFx();
}

/* ---------- render: pagos ---------- */
function renderPay(){
  const mine=myPays(ME);
  const est=mine.reduce((a,x)=>a+(+x.amt||0),0);
  const paid=mine.reduce((a,x)=>a+(ME.paid[x.id]?+x.amt||0:0),0);
  const byDay={};
  mine.forEach(x=>{(byDay[x.day]=byDay[x.day]||[]).push(x)});
  let h=`<div class="tots"><div class="tot"><b>${fmt(est)}</b><span>Estimado</span></div><div class="tot" style="background:var(--t2)"><b style="color:var(--c2)">${fmt(paid)}</b><span>Pagado</span></div><div class="tot" style="background:var(--t1)"><b style="color:var(--c1)">${fmt(Math.max(est-paid,0))}</b><span>Falta</span></div></div>`;
  Object.keys(byDay).sort((a,b)=>a-b).forEach(day=>{
    const dd=D.days.find(x=>x.n==day);
    const items=byDay[day];
    const dEst=items.reduce((a,x)=>a+(+x.amt||0),0);
    const dPaid=items.reduce((a,x)=>a+(ME.paid[x.id]?+x.amt||0:0),0);
    const cats={};items.forEach(x=>{(cats[x.cat]=cats[x.cat]||[]).push(x)});
    h+=`<div class="pday" style="--t:var(--t${dd?dd.r:4});--c:var(--c${dd?dd.r:4})"><header><h3>${dd?dd.dt:"Día "+day}</h3><span>${fmt(dPaid)} / ${fmt(dEst)}</span></header>`;
    Object.keys(cats).forEach(c=>{
      h+=`<div class="cat"><h4>${c}</h4>${cats[c].map(x=>{
        const ok=!!ME.paid[x.id];
        return `<div class="pay ${ok?"ok":""}" data-id="${x.id}"><span class="bx">${ok?"✓":""}</span><span class="nm">${x.item}</span><span class="am" ${ADMIN?'contenteditable="true" data-amt="'+x.id+'"':""}>${fmt(x.amt)}${x.note?`<small>${x.note}</small>`:""}</span></div>`}).join("")}</div>`;
    });
    h+=`</div>`;
  });
  $("v-pay").innerHTML=h;
  $("v-pay").querySelectorAll(".pay").forEach(el=>el.onclick=e=>{
    if(e.target.dataset.amt)return;
    const id=el.dataset.id;
    ME.paid[id]=!ME.paid[id];if(!ME.paid[id])delete ME.paid[id];
    save();renderPay();
  });
}

/* ---------- render: admin ---------- */
function renderAdm(){
  let h=`<h2 style="margin-top:0">Personas del viaje</h2><div id="addp"><div class="row"><input id="np-n" placeholder="Nombre"><input id="np-c" placeholder="Código de acceso"></div>
  <div class="row"><select id="np-who"><option value="g1">Grupo 1 (viaja del 2)</option><option value="g2">Grupo 2 (llega el 8)</option></select>
  <select id="np-arr"><option value="baq">Llega desde Barranquilla</option><option value="copey">Llega desde El Copey</option><option value="g2">Vuelo del 8 (g2)</option></select></div>
  <div class="row"><select id="np-ret"><option value="baq">Regresa a Barranquilla</option><option value="smt">Regresa a Santa Marta</option></select>
  <button id="np-add">Agregar persona</button></div></div>`;
  D.people.forEach(p=>{
    const mine=myPays(p);
    const est=mine.reduce((a,x)=>a+(+x.amt||0),0);
    const paid=mine.reduce((a,x)=>a+(p.paid[x.id]?+x.amt||0:0),0);
    h+=`<div class="aprow" style="--c:var(--c1)"><b>${p.name} <span style="color:var(--mut);font-weight:500">(${p.code})</span></b>
    <select data-f="who" data-id="${p.id}"><option value="g1" ${p.who==="g1"?"selected":""}>G1</option><option value="g2" ${p.who==="g2"?"selected":""}>G2</option></select>
    <select data-f="arr" data-id="${p.id}"><option value="baq" ${p.arr==="baq"?"selected":""}>Baq</option><option value="copey" ${p.arr==="copey"?"selected":""}>Copey</option><option value="g2" ${p.arr==="g2"?"selected":""}>Vuelo 8</option></select>
    <select data-f="ret" data-id="${p.id}"><option value="baq" ${p.ret==="baq"?"selected":""}>→Baq</option><option value="smt" ${p.ret==="smt"?"selected":""}>→SM</option></select>
    <span class="paidall">${fmt(paid)}/${fmt(est)}</span>
    <button class="del" data-del="${p.id}">✕</button></div>`;
  });
  h+=`<div class="atools"><button id="a-cp">Copiar todos los datos</button><button id="a-imp">Importar datos</button><button class="rs" id="a-rs">Restablecer</button><button id="a-out">Salir del admin</button></div>
  <p style="color:var(--mut);font-size:.85rem">En la pestaña <b>Pagos</b> puedes tocar los precios para corregirlos. Los ítems en $0 con "falta precio" son los que faltan por confirmar.</p>`;
  $("v-adm").innerHTML=h;
  $("np-add").onclick=()=>{
    const n=$("np-n").value.trim(),c=$("np-c").value.trim().toLowerCase();
    if(!n||!c)return alert("Escribe nombre y código");
    if(D.people.some(p=>p.code===c))return alert("Ese código ya existe");
    D.people.push({id:"p"+Date.now(),name:n,code:c,who:$("np-who").value,arr:$("np-arr").value,ret:$("np-ret").value,paid:{}});
    save();renderAdm();
  };
  $("v-adm").querySelectorAll("[data-f]").forEach(s=>s.onchange=()=>{
    const p=D.people.find(x=>x.id===s.dataset.id);p[s.dataset.f]=s.value;save();
  });
  $("v-adm").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(confirm("¿Quitar a esta persona?")){D.people=D.people.filter(x=>x.id!==b.dataset.del);save();renderAdm()}
  });
  $("a-cp").onclick=async()=>{const t=JSON.stringify(D);try{await navigator.clipboard.writeText(t);alert("Datos copiados")}catch(e){prompt("Copia estos datos",t)}};
  $("a-imp").onclick=()=>{const t=prompt("Pega los datos JSON:");try{const x=JSON.parse(t);if(x&&x.ver===VER){D=x;save();renderAdm();renderItin();renderPay();alert("Importado")}else alert("Datos no válidos")}catch(e){alert("JSON no válido")}};
  $("a-rs").onclick=()=>{if(confirm("¿Restablecer TODO (personas, pagos y textos)?")){try{localStorage.removeItem("itin2")}catch(e){}location.reload()}};
  $("a-out").onclick=()=>{ADMIN=false;document.body.classList.remove("admin");$("m-adm").style.display="none";renderPay();};
}

/* ---------- scroll fx ---------- */
let io=null,secs=[],scs=[];
function bindScrollFx(){
  secs=[...document.querySelectorAll(".day")];scs=secs.map(s=>s.querySelector(".sc"));
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
}
function onS(){
  const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
  $("bar").classList.toggle("on",y>innerHeight*.55);
  $("mk").style.left=(max>0?y/max*100:0)+"%";
  let a=null;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.4)a=i});
  if(a!==null){const d=D.days[a];$("lab").textContent="Día "+d.n+": "+d.t;$("mk").style.background="var(--c"+d.r+")"}
  secs.forEach((s,i)=>{const r=s.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)scs[i].style.transform="translateY("+(r.top-innerHeight/2)*.06+"px)"});
}
addEventListener("scroll",onS,{passive:true});

/* ---------- vistas ---------- */
function show(v){
  document.querySelectorAll("#menu button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("app").style.display=v==="itin"?"":"none";
  $("v-hero").style.display=v==="itin"?"":"none";
  $("v-pay").style.display=v==="pay"?"":"none";
  $("v-adm").style.display=v==="adm"?"":"none";
  $("bar").style.display=v==="itin"?"":"none";
  scrollTo(0,0);onS();
}
document.querySelectorAll("#menu button").forEach(b=>b.onclick=()=>show(b.dataset.v));

/* ---------- login ---------- */
function enter(p){
  ME=p;
  document.body.classList.add("in");
  $("lg").style.display="none";
  $("who").textContent="Hola, "+p.name;
  renderItin();renderPay();show("itin");
}
function tryLogin(){
  const v=$("lin").value.trim().toLowerCase();
  const p=D.people.find(x=>x.name.toLowerCase()===v||x.code.toLowerCase()===v);
  if(p){$("lerr").textContent="";enter(p)}
  else{$("lerr").textContent="Nombre o código no reconocido. Pide a Kalen que te agregue."}
}
$("lgo").onclick=tryLogin;
$("lin").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin()});
$("ladm").onclick=()=>{
  if(prompt("Contraseña de admin")==="kalen2026"){
    if(!ME&&D.people.length){ME=D.people[0]}
    if(!ME){const p={id:"p1",name:"Kalen",code:"kalen",who:"g1",arr:"baq",ret:"baq",paid:{}};D.people.unshift(p);ME=p;save()}
    ADMIN=true;document.body.classList.add("admin","in");
    $("lg").style.display="none";$("who").textContent="Admin";
    $("m-adm").style.display="grid";renderItin();renderPay();renderAdm();show("adm");
  }else alert("Contraseña incorrecta");
};

/* ---------- edición de precios (admin, delegado) ---------- */
addEventListener("input",e=>{
  const id=e.target.dataset&&e.target.dataset.amt;
  if(id&&ADMIN){const p=D.pays.find(x=>x.id===id);const v=parseInt(e.target.textContent.replace(/\D/g,""))||0;p.amt=v;p.note="";save()}
});
addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.amt){e.preventDefault();e.target.blur();renderPay()}});
</script></body></html>
