<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Del Caribe al Eje Cafetero · 2 al 12 de octubre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f7f5;--ink:#14302e;--mut:#566d69;--line:#d3ded9;--panel:#fff;--on:#fff;--c1:#0b7fa0;--c2:#2a8a4a;--c3:#5865b0;--c4:#a0561d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1c;--ink:#e6f0ee;--mut:#9bb0ac;--line:#27393a;--panel:#162627;--on:#0f1b1c;--c1:#3db5da;--c2:#4cc275;--c3:#8f9bea;--c4:#e0924f}}
:root[data-theme="dark"]{--bg:#0f1b1c;--ink:#e6f0ee;--mut:#9bb0ac;--line:#27393a;--panel:#162627;--on:#0f1b1c;--c1:#3db5da;--c2:#4cc275;--c3:#8f9bea;--c4:#e0924f}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header{padding:48px 0 26px}
h1,h2,.st{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
h1{font-weight:800;font-size:clamp(2.2rem,9vw,3.7rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px}
.sub{color:var(--mut);max-width:34em;margin:0 0 20px}
.leg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.9rem}
.leg span{display:flex;align-items:center;gap:7px}
.leg i{width:24px;height:6px;border-radius:3px;background:var(--c)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
nav a{flex:none;min-width:42px;text-align:center;padding:5px 10px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem;border:1.5px solid var(--c)}
nav a:hover,nav a:focus-visible{background:var(--c);color:var(--on);outline:none}
main{padding-top:34px}
.day{position:relative;display:grid;grid-template-columns:48px 1fr;gap:0 16px;padding-bottom:36px}
.day::before{content:"";position:absolute;left:21px;top:44px;bottom:-4px;width:6px;border-radius:3px;background:var(--c)}
.day:last-child::before{display:none}
.st{position:relative;width:48px;height:48px;border-radius:50%;background:var(--c);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:1.25rem;box-shadow:0 0 0 5px var(--bg)}
.dt{color:var(--mut);font-size:.92rem;font-weight:500;margin:2px 0 0}
h2{font-weight:700;font-size:1.5rem;line-height:1.15;margin:2px 0 4px}
.bd{display:inline-block;background:var(--c);color:var(--on);font-size:.82rem;font-weight:600;padding:2px 10px;border-radius:999px;margin:4px 0 0}
ul{list-style:none;margin:14px 0 0;padding:0}
li{display:grid;grid-template-columns:5.4rem 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.tm{font-weight:600;font-size:.92rem;color:var(--mut)}
.n{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--c);background:var(--panel);border-radius:0 8px 8px 0;font-size:.93rem}
.n b{font-weight:600}
footer{padding:4px 0 56px;color:var(--mut);font-size:.88rem}
@media (max-width:480px){.day{grid-template-columns:40px 1fr;gap:0 12px}.st{width:40px;height:40px;font-size:1.05rem}.day::before{left:17px;top:36px}li{grid-template-columns:4.6rem 1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head>
<body>
<header><div class="wrap">
<h1>Del Caribe al Eje Cafetero</h1>
<p class="sub">Del 2 al 12 de octubre de 2026: Santa Marta, Medellín, Jardín, Los Nevados, Pereira y Salento. Cada color es una región del camino.</p>
<div class="leg"><span style="--c:var(--c1)"><i></i>Caribe</span><span style="--c:var(--c2)"><i></i>Antioquia</span><span style="--c:var(--c3)"><i></i>Páramo</span><span style="--c:var(--c4)"><i></i>Eje Cafetero</span></div>
</div></header>
<nav><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="days"></main>
<footer><div class="wrap">Horarios y precios aproximados, tomados del presupuesto. Confirmen todo antes de salir.</div></footer>
<script>
const L="Comodo Family Laureles, Medellín, $65.000 por persona",M="Mahalo, Salento, $54.000 por persona";
const D=[
{n:2,w:"Viernes",t:"Barranquilla a El Rodadero",r:1,s:[["4:00 PM","Salida de Barranquilla hacia Santa Marta"],["Tarde","Llegada a El Rodadero y check-in"],["Noche","Cena tranquila y a dormir temprano"]],h:"Hotel en El Rodadero, $35.000 por persona (5 personas)",k:"El vuelo del 3 sale a las 7:15 AM. Dejen las maletas listas y acuéstense temprano."},
{n:3,w:"Sábado",t:"Vuelo a Medellín",r:2,s:[["Madrugada","Despertar temprano y salir al aeropuerto (mejor llegar hacia las 5:15 AM)"],["7:15 AM","Vuelo de Santa Marta a Medellín"],["Mañana","Llegada a Rionegro, bus a Medellín ($25.000) y metro hasta el hotel"],["Tarde","Parque Explora (entrada $50.000)"],["Noche","Cena y descanso"]],h:L,k:"Dejen la tarde flexible por si el vuelo o el bus se demoran."},
{n:4,w:"Domingo",t:"City tour por Medellín",r:2,s:[["Mañana","City tour ($130.000)"],["Tarde","Libre para almorzar y descansar"],["Noche","Cena"]],h:L},
{n:5,w:"Lunes",t:"Guatapé",r:2,s:[["Todo el día","Tour a Guatapé ($130.000)"],["Noche","Cena y empacar para Jardín"]],h:L,k:"Confirmen con la agencia el punto de encuentro y la hora de salida."},
{n:6,w:"Martes",t:"De Medellín a Jardín",r:2,s:[["Mañana","Del hotel a la terminal y bus a Jardín ($50.000)"],["Almuerzo","Almuerzo en Jardín"],["Tarde","Plaza y calles del pueblo"],["Noche","Cena en Jardín"]],h:"Casa Colonial, Jardín, $66.000 por persona"},
{n:7,w:"Miércoles",t:"De Jardín a Murillo",r:3,s:[["Mañana","Bus de Jardín a Manizales ($60.000)"],["1:00 PM","Llegada a Manizales y almuerzo"],["2:30 PM","Recoger el carro de alquiler"],["3:00 PM","Salida a Murillo: 83 km por el páramo, con una o dos paradas (Laguna Negra, mirador)"],["5:30 PM","Check-in y cena típica (migao)"]],h:"Cabaña Dos Búhos, Murillo, $66.000 por persona",k:"Salgan de Manizales a más tardar a las 3 PM para llegar con luz: el páramo con neblina de noche no conviene. Murillo está a más de 3.000 m, vayan suave. Revisen el pico y placa ambiental de la vía."},
{n:8,w:"Jueves",t:"Los Nevados y termales",r:3,b:"Se une el grupo 2",s:[["6:00 AM","Salida de Murillo"],["7:30 AM","Parque Nacional Los Nevados: Laguna Negra, frailejones y mirador del Ruiz (guía y vehículo $60.000)"],["10:30 AM","Bajar hacia Pereira, con almuerzo en Manizales"],["2:00 PM","Encuentro de todos en el hotel de Pereira (el grupo 2 aterriza a la 1 PM)"],["6:00 PM","Termales de Santa Rosa de Cabal ($70.000)"],["9:30 PM","Regreso al hotel"]],h:"Hotel en Pereira (por escoger)",k:"Busquen un hotel con parqueadero y check-in desde la 1 PM, porque será el punto de encuentro. Confirmen el horario de los termales y que el parque esté abierto."},
{n:9,w:"Viernes",t:"Filandia y Salento",r:4,s:[["8:30 AM","Check-out y salida de Pereira"],["10:00 AM","Filandia: calles coloridas y mirador Colina Iluminada"],["1:00 PM","Almuerzo en Filandia"],["3:00 PM","Check-in en Mahalo, Salento"],["4:30 PM","Calle Real y mirador"]],h:M},
{n:10,w:"Sábado",t:"Parque del Café",r:4,s:[["8:00 AM","Salida de Salento (cerca de 1 hora de camino)"],["9:30 AM","Parque del Café, todo el día y almuerzo adentro (entrada $90.000)"],["5:30 PM","Regreso a Salento y cena"]],h:M,k:"Es puente festivo: compren las entradas con anticipación y lleguen a la apertura."},
{n:11,w:"Domingo",t:"Valle del Cocora",r:4,s:[["7:00 AM","Willys hacia el valle ($14.000)"],["7:30 AM","Caminata entre palmas de cera, de 4 a 5 horas (entrada $30.000)"],["1:30 PM","Almuerzo en Salento"],["3:30 PM","Tarde libre, compras y maletas"]],h:M,k:"Madruguen: en el puente festivo hay filas para los Willys."},
{n:12,w:"Lunes",t:"De Salento a Barranquilla",r:4,s:[["9:00 AM","Desayuno y check-out"],["12:00 PM","Salida hacia Pereira (cerca de 1 h 15)"],["1:30 PM","Devolver el carro y almorzar"],["3:00 PM","Llegada al aeropuerto Matecaña"],["5:00 PM","Vuelo de Pereira a Barranquilla"]],k:"Hoy es festivo y puede haber tráfico de regreso del puente. Tanqueen antes de devolver el carro."}
];
const nav=document.getElementById("nav"),box=document.getElementById("days");
D.forEach(d=>{
nav.insertAdjacentHTML("beforeend",`<a href="#d${d.n}" style="--c:var(--c${d.r})">${d.n}</a>`);
box.insertAdjacentHTML("beforeend",`<section class="day" id="d${d.n}" style="--c:var(--c${d.r})"><div class="st">${d.n}</div><div><p class="dt">${d.w} ${d.n} de octubre</p><h2>${d.t}</h2>${d.b?`<span class="bd">${d.b}</span>`:""}<ul>${d.s.map(s=>`<li><span class="tm">${s[0]}</span><span>${s[1]}</span></li>`).join("")}</ul>${d.h?`<p class="n"><b>Dormir:</b> ${d.h}</p>`:""}${d.k?`<p class="n"><b>Ojo:</b> ${d.k}</p>`:""}</div></section>`);
});
</script>
</body></html>
